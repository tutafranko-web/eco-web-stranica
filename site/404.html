<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ova stranica ne postoji — PIER bistro</title>
<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="#0a0d10">
<meta name="color-scheme" content="dark">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,200;0,9..144,300;1,9..144,200&family=Archivo:wght@400;500;600&display=swap">
<style>
:root{
  --ink:#090c0f; --stone:#0e1216; --line:#232a30;
  --lime:#ece7db; --lime-dim:#aaa294; --brass:#c8912f; --brass-lit:#e2b14e;
  --f-disp:"Fraunces",Georgia,"Times New Roman",serif;
  --f-ui:"Archivo","Segoe UI",system-ui,sans-serif;
  --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; min-height:100svh; background:var(--ink); color:var(--lime);
  font:400 15.5px/1.62 var(--f-ui);
  display:flex; flex-direction:column; justify-content:center;
  padding:3rem 1.35rem calc(3rem + var(--sab));
  background-image:
    radial-gradient(120% 60% at 50% -10%,rgba(200,145,47,.09),transparent 62%),
    linear-gradient(180deg,var(--stone),var(--ink) 38%);
}
@media (min-width:600px){ body{padding-left:2.25rem; padding-right:2.25rem} }
.wrap{max-width:33rem; margin:0 auto; width:100%}
.hair{width:100%; max-width:180px; height:1px; background:linear-gradient(90deg,var(--brass),transparent); margin-bottom:1.6rem}
.mark{font:500 9.5px var(--f-ui); letter-spacing:.36em; text-transform:uppercase; color:var(--brass); text-indent:.36em; margin-bottom:1.4rem}
h1{
  font-family:var(--f-disp); font-weight:200; font-size:clamp(2.1rem,9vw,3.1rem);
  line-height:1.1; margin:0 0 1.1rem; text-wrap:balance;
}
h1 em{font-style:italic; color:var(--brass-lit)}
p{color:var(--lime-dim); margin:0 0 1.9rem; max-width:28rem}
.veze{display:flex; flex-wrap:wrap; gap:.7rem}
a.go{
  display:inline-flex; align-items:center; min-height:48px; padding:.95rem 1.5rem;
  background:var(--brass); color:#120d05; text-decoration:none;
  font:600 10.5px var(--f-ui); letter-spacing:.3em; text-transform:uppercase;
}
a.go:hover{background:var(--brass-lit)}
a.tih{
  display:inline-flex; align-items:center; min-height:48px; padding:.95rem 1.4rem;
  border:1px solid var(--line); color:var(--lime-dim); text-decoration:none;
  font:600 10.5px var(--f-ui); letter-spacing:.3em; text-transform:uppercase;
}
a.tih:hover{color:var(--lime); border-color:#3a434b}
.pod{margin-top:2.6rem; padding-top:1.3rem; border-top:1px solid var(--line); font-size:12.5px; color:#6f7d86}
</style>
</head>
<body>
  <div class="wrap">
    <div class="hair"></div>
    <div class="mark">PIER · 404</div>
    <h1>Ovdje nema <em>ničega</em></h1>
    <p>
      Adresa koju si otvorio ne postoji na ovoj stranici — vjerojatno je
      stara veza ili slovo viška. Šetnja kroz prostor i rezervacija stola
      čekaju na početnoj.
    </p>
    <div class="veze">
      <a class="go" href="/">Na početnu</a>
      <a class="tih" href="/#rezervacija">Rezerviraj stol</a>
    </div>
    <div class="pod">PIER bistro · Velo Varoš, Split</div>
  </div>
</body>
</html>
